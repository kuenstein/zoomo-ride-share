<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — Zoomo</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101114;color:#f5f5f5;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  h1{font-size:28px;margin:16px 0 8px} p{color:#a1a1aa;max-width:320px;margin:0 auto 20px}
  button{background:#39ff88;color:#101114;border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:16px}
</style>
</head>
<body>
  <div>
    <img src="/icon-192.png" width="72" height="72" alt="" />
    <h1>You're offline</h1>
    <p>Zoomo needs an internet connection to book and track rides. Check your data or Wi-Fi, then try again.</p>
    <p>In an emergency call <a href="tel:911" style="color:#39ff88">911</a>.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
